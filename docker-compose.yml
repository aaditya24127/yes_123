# Local database for development, on any computer with Docker:   docker compose up -d db
# Matches DATABASE_URL in .env.example (user postgres, password postgres, database crp, port 5432). Local use only.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crp
    ports:
      - "5432:5432"
    volumes:
      - crp-db:/var/lib/postgresql/data
volumes:
  crp-db:
